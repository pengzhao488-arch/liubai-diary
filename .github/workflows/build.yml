name: Build Android and Windows apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Preview signing only. A permanent release signing key is needed before regular upgrades.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liubai-android-preview-signing-v1
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: LiubaiDiary-Android-Preview-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: python tool/prepare.py
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $runtime = Get-ChildItem "${env:ProgramFiles}/Microsoft Visual Studio/2022/*/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'Visual C++ runtime not found' }
          Copy-Item "$($runtime.FullName)/*.dll" $release
      - name: Create Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler 'tool/installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LiubaiDiary-Windows11-Installer
          path: installer/LiubaiDiary-Windows11-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: LiubaiDiary-Windows11-Portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
